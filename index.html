<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-op Journey | แดชบอร์ดติดตามการฝึกสหกิจศึกษา</title>
    
    <!-- Google Fonts: Prompt & Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        display: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#EEF2FF',
                            100: '#E0E7FF',
                            200: '#C7D2FE',
                            500: '#6366F1',
                            600: '#4F46E5',
                            700: '#4338CA',
                        },
                        mint: {
                            50: '#ECFDF5',
                            100: '#D1FAE5',
                            500: '#10B981',
                            600: '#059669',
                        },
                        coral: {
                            50: '#FFF1F2',
                            100: '#FFE4E6',
                            500: '#F43F5E',
                            600: '#E11D48',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(15, 23, 42, 0.05)',
                        'card': '0 10px 25px -5px rgba(79, 70, 229, 0.06), 0 4px 10px -3px rgba(15, 23, 42, 0.03)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F8FAFC;
            color: #1E293B;
            font-family: 'Prompt', sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        /* Smooth Progress Bar Animation */
        .progress-bar-fill {
            transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Calendar Cell Hover & Transition */
        .calendar-day {
            transition: all 0.2s ease;
        }
        .calendar-day:hover:not(.outside-range) {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px -3px rgba(79, 70, 229, 0.12);
            z-index: 10;
        }

        /* Subtle striped pattern for outside range days */
        .outside-range-bg {
            background-image: radial-gradient(#CBD5E1 0.75px, transparent 0.75px);
            background-size: 10px 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-100 selection:text-brand-700">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Top Navigation & Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <!-- Brand & Title -->
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-brand-500 to-sky-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 shrink-0">
                        <i data-lucide="calendar-check-2" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <h1 class="text-lg sm:text-xl font-display font-semibold text-slate-800 tracking-tight">
                                Co-op Journey <span class="text-brand-600">2569–2570</span>
                            </h1>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-sky-50 text-sky-700 border border-sky-200/70">
                                25 ต.ค. 69 – 12 ก.พ. 70
                            </span>
                        </div>
                        <p class="text-xs sm:text-sm text-slate-500">แดชบอร์ดปฏิทินนับถอยหลังและติดตามความคืบหน้าการฝึกสหกิจศึกษา</p>
                    </div>
                </div>

                <!-- Reference Date Mode & Data Tools -->
                <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                    <!-- Date Mode Switcher -->
                    <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200/70">
                        <button id="btn-mode-sys" onclick="setDateMode('system')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 bg-white text-brand-600 shadow-sm">
                            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                            <span>วันที่จริงของระบบ</span>
                        </button>
                        <button id="btn-mode-sim" onclick="setDateMode('sim')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 text-slate-600 hover:text-slate-900">
                            <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                            <span>จำลองวันที่</span>
                        </button>
                    </div>

                    <!-- Date Simulator Picker (Hidden by default in System Mode) -->
                    <div id="sim-date-wrapper" class="hidden flex items-center gap-1.5 bg-white border border-slate-200 rounded-xl px-2.5 py-1 shadow-xs">
                        <span class="text-xs text-slate-400">วันที่อ้างอิง:</span>
                        <input type="date" id="sim-date-input" min="2026-10-01" max="2027-02-28" value="2026-11-24" onchange="handleSimDateChange(this.value)" class="text-xs font-medium text-slate-700 focus:outline-none bg-transparent cursor-pointer">
                    </div>

                    <!-- Export / Import / Reset JSON -->
                    <div class="flex items-center gap-1.5">
                        <button onclick="exportData()" title="สำรองข้อมูล (Export JSON)" class="p-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-brand-600 hover:border-brand-200 hover:bg-brand-50/50 transition-all shadow-xs">
                            <i data-lucide="download" class="w-4 h-4"></i>
                        </button>
                        <label title="นำเข้าข้อมูล (Import JSON)" class="p-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-brand-600 hover:border-brand-200 hover:bg-brand-50/50 transition-all shadow-xs cursor-pointer">
                            <i data-lucide="upload" class="w-4 h-4"></i>
                            <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                        </label>
                        <button onclick="resetToDefaultTasks()" title="รีเซ็ตกลับเป็นค่าเริ่มต้น" class="p-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:text-coral-600 hover:border-coral-200 hover:bg-coral-50/50 transition-all shadow-xs">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Section 1: KPI Cards & Progress Bar -->
        <section class="space-y-4">
            <!-- KPI Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Card 1: Total Days -->
                <div class="bg-white rounded-2xl p-5 border border-slate-200/70 shadow-soft flex items-start justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">ระยะเวลาทั้งหมด</p>
                        <div class="mt-2 flex items-baseline gap-2">
                            <span id="kpi-total-days" class="text-3xl font-display font-bold text-slate-800">111</span>
                            <span class="text-sm font-medium text-slate-500">วัน</span>
                        </div>
                        <p id="kpi-total-workdays" class="mt-1.5 text-xs text-slate-500 flex items-center gap-1">
                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-500"></span>
                            วันทำการจริง 76 วัน
                        </p>
                    </div>
                    <div class="w-11 h-11 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center shrink-0">
                        <i data-lucide="calendar-range" class="w-5 h-5"></i>
                    </div>
                </div>

                <!-- Card 2: Days Passed -->
                <div class="bg-white rounded-2xl p-5 border border-slate-200/70 shadow-soft flex items-start justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">ฝึกผ่านไปแล้ว</p>
                        <div class="mt-2 flex items-baseline gap-2">
                            <span id="kpi-passed-days" class="text-3xl font-display font-bold text-mint-600">31</span>
                            <span class="text-sm font-medium text-slate-500">วัน</span>
                        </div>
                        <p id="kpi-passed-workdays" class="mt-1.5 text-xs text-mint-600 font-medium flex items-center gap-1">
                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                            <span>วันทำการ 22 วัน</span>
                        </p>
                    </div>
                    <div class="w-11 h-11 rounded-2xl bg-mint-50 text-mint-600 flex items-center justify-center shrink-0">
                        <i data-lucide="award" class="w-5 h-5"></i>
                    </div>
                </div>

                <!-- Card 3: Days Remaining -->
                <div class="bg-white rounded-2xl p-5 border border-slate-200/70 shadow-soft flex items-start justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">เหลือเวลาอีก</p>
                        <div class="mt-2 flex items-baseline gap-2">
                            <span id="kpi-remaining-days" class="text-3xl font-display font-bold text-sky-600">80</span>
                            <span class="text-sm font-medium text-slate-500">วัน</span>
                        </div>
                        <p id="kpi-remaining-workdays" class="mt-1.5 text-xs text-sky-600 font-medium flex items-center gap-1">
                            <i data-lucide="briefcase" class="w-3.5 h-3.5"></i>
                            <span>วันทำการเหลือ 54 วัน</span>
                        </p>
                    </div>
                    <div class="w-11 h-11 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center shrink-0">
                        <i data-lucide="hourglass" class="w-5 h-5"></i>
                    </div>
                </div>

                <!-- Card 4: Holidays & Weekends -->
                <div class
